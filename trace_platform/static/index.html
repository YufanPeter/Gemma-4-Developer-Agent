<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemma Trace</title>
<style>
:root {
  color-scheme: light;
  --bg: #f7f7f5; --panel: #ffffff; --side: #fbfbfa; --ink: #18181b; --ink2: #3f3f46; --muted: #71717a; --line: #e7e7e4;
  --line2: #f1f1ef; --hover: #f2f2f0; --sel: #eaf2fd; --accent: #2a78d6; --accent-ink: #1c5cab;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --other: #b4b3ad;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
  --ok-bg: #e7f6e7; --ok-ink: #0a6b0a; --err-bg: #fbeaea; --err-ink: #b42323; --warn-bg: #fff4dc; --warn-ink: #8a5a00;
  --na-bg: #f0efec; --na-ink: #52514e; --run-bg: #e6f0fc; --run-ink: #1c5cab;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --panel: #1a1a19; --side: #151514; --ink: #f0efec; --ink2: #d4d3cd; --muted: #9b9a93; --line: #2c2c2a;
    --line2: #232322; --hover: #232322; --sel: #172a44; --accent: #3987e5; --accent-ink: #86b6ef;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --other: #5c5b56;
    --ok-bg: #11301a; --ok-ink: #6fd17a; --err-bg: #3a1716; --err-ink: #ff8f8a; --warn-bg: #3a2b0e; --warn-ink: #f6c45a;
    --na-bg: #262624; --na-ink: #b3b2ab; --run-bg: #16294a; --run-ink: #86b6ef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --panel: #1a1a19; --side: #151514; --ink: #f0efec; --ink2: #d4d3cd; --muted: #9b9a93; --line: #2c2c2a;
  --line2: #232322; --hover: #232322; --sel: #172a44; --accent: #3987e5; --accent-ink: #86b6ef;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --other: #5c5b56;
  --ok-bg: #11301a; --ok-ink: #6fd17a; --err-bg: #3a1716; --err-ink: #ff8f8a; --warn-bg: #3a2b0e; --warn-ink: #f6c45a;
  --na-bg: #262624; --na-ink: #b3b2ab; --run-bg: #16294a; --run-ink: #86b6ef;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; }
input, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; outline: none; }
input:focus, select:focus { border-color: var(--accent); }
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; cursor: pointer; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--s1), var(--s7)); color: #fff; display: grid; place-items: center; font-weight: 700; }
.brand b { font-size: 14px; } .brand small { display: block; color: var(--muted); font-size: 11px; margin-top: -2px; }
.nav { flex: 1; overflow: auto; padding: 4px 8px; }
.nav h6 { margin: 14px 8px 4px; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .4px; }
.nav a { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: var(--ink2); text-decoration: none; cursor: pointer; }
.nav a:hover { background: var(--hover); }
.nav a.on { background: var(--sel); color: var(--accent-ink); font-weight: 600; }
.nav a span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.nav a .count { font-size: 11px; color: var(--muted); font-weight: 500; }
.led { width: 7px; height: 7px; border-radius: 50%; background: var(--other); flex: none; }
.led.live { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); animation: pulse 1.6s infinite; }
.led.stale { background: var(--warning); }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--good) 5%, transparent); } }
.side-foot { border-top: 1px solid var(--line); padding: 10px; display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
.iconbtn { border: 0; background: none; padding: 5px 7px; border-radius: 7px; cursor: pointer; color: var(--muted); margin-left: auto; }
.iconbtn:hover { background: var(--hover); color: var(--ink); }
.main { overflow: auto; min-width: 0; }
.page { padding: 18px 24px 40px; max-width: 1560px; }
.crumbs { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
.ph { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.ph h1 { font-size: 19px; margin: 0; font-family: var(--mono); }
.ph p { margin: 2px 0 0; color: var(--muted); }
.grow { flex: 1; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; }
.ch { margin: 0; padding: 12px 14px 0; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ch small { color: var(--muted); font-weight: 400; }
.cb { padding: 10px 14px 14px; }
.grid { display: grid; gap: 14px; } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: 2fr 1fr; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.kpi b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.25; }
.kpi span { color: var(--muted); font-size: 11px; }
.kpi .bar { height: 4px; background: var(--line2); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.kpi .bar i { display: block; height: 100%; background: var(--accent); }
.pill { display: inline-flex; gap: 4px; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.s-ok { background: var(--ok-bg); color: var(--ok-ink); } .s-err { background: var(--err-bg); color: var(--err-ink); }
.s-warn { background: var(--warn-bg); color: var(--warn-ink); } .s-run { background: var(--run-bg); color: var(--run-ink); }
.s-na { background: var(--na-bg); color: var(--na-ink); }
.tag { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--ink2); background: var(--na-bg); border-radius: 5px; padding: 0 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--panel); }
.seg button { border: 0; background: none; padding: 4px 11px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--sel); color: var(--accent-ink); font-weight: 600; }
.muted { color: var(--muted); } .mono { font-family: var(--mono); font-size: 12px; }
.empty { color: var(--muted); padding: 40px 16px; text-align: center; }
.note { font-size: 12px; padding: 8px 11px; border-radius: 8px; background: var(--na-bg); color: var(--na-ink); margin-bottom: 10px; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); cursor: pointer; user-select: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--hover); }
td.err { color: var(--err-ink); max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
.meter { position: relative; height: 6px; background: var(--line2); border-radius: 3px; width: 90px; display: inline-block; vertical-align: middle; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.chart { width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
pre { margin: 0; font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
pre.code { background: var(--line2); border-radius: 8px; padding: 10px; max-height: 480px; overflow: auto; }
pre.th { color: var(--muted); font-style: italic; }
.diff .a { color: var(--ok-ink); } .diff .d { color: var(--err-ink); } .diff .h { color: var(--accent); }
.step { border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: 8px; margin-bottom: 6px; background: var(--panel); }
.step.flash { outline: 2px solid var(--accent); }
.sh { display: flex; gap: 8px; align-items: center; padding: 6px 10px; cursor: pointer; flex-wrap: wrap; }
.sh .n { font: 600 12px var(--mono); color: var(--muted); min-width: 30px; }
.sh .sum { color: var(--ink2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 160px; }
.sh .fn { font: 600 12px var(--mono); }
.sh .meta { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip-a { color: #fff; font-size: 11px; padding: 0 7px; border-radius: 10px; }
.sb { display: none; padding: 0 10px 10px; } .step.open .sb { display: block; }
.lbl { font-size: 11px; color: var(--muted); margin: 8px 0 3px; letter-spacing: .3px; }
.ctxbar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: var(--line2); position: relative; }
.ctxbar > i { height: 100%; }
.ctxbar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; }
.comp { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.comp b { font-variant-numeric: tabular-nums; }
.runcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; padding: 12px 14px; border-bottom: 1px solid var(--line2); cursor: pointer; }
.runcard:hover { background: var(--hover); }
.runcard .nm { font: 600 13px var(--mono); display: flex; gap: 8px; align-items: center; }
.prog { height: 6px; background: var(--line2); border-radius: 3px; overflow: hidden; display: flex; margin-top: 4px; }
.prog i { height: 100%; }
.live-strip { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink2); }
@media (max-width: 900px) { .app { grid-template-columns: 1fr; } .side { display: none; } .g2, .g3 { grid-template-columns: 1fr; } .page { padding: 14px 16px; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand" onclick="go('#/')"><div class="logo">G</div><div><b>Gemma Trace</b><small>Kaggle dev-eval 监控</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span class="led" id="sse-led"></span><span id="sse-txt">连接中…</span>
      <button class="iconbtn" id="theme" title="切换主题">◐</button></div>
  </aside>
  <main class="main" id="main"><div class="empty">加载中…</div></main>
</div>
<script src="/static/vendor/echarts-5.6.0.min.js"></script>
<script>
"use strict";
// ── utilities ────────────────────────────────────────────────────────────────
const $ = (s, el = document) => el.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtS = s => { if (s == null || isNaN(s)) return "–"; s = Math.round(s); if (s >= 3600) return `${Math.floor(s / 3600)}h${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}m`; return s >= 60 ? `${Math.floor(s / 60)}m${String(s % 60).padStart(2, "0")}s` : `${s}s`; };
const fmtK = n => n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(Math.round(n));
const ago = ts => ts ? fmtS(Date.now() / 1000 - ts) + "前" : "–";
const med = a => { a = a.filter(x => x != null).sort((x, y) => x - y); return a.length ? a[Math.floor(a.length / 2)] : null; };
const api = async p => { const r = await fetch(p, { cache: "no-store" }); if (!r.ok) throw new Error(await r.text()); return r.json(); };
const RUN_BUDGET = 12 * 3600;  // Kaggle session limit
// Per-run budget from run_meta (eval_config / limits); defaults = the dev-eval notebook's.
function budget(r = S.run) {
  const e = r?.meta?.eval_config || {}, l = r?.meta?.limits || {};
  return { cap: (e.max_time_minutes ?? 8) * 60, calls: e.max_tool_calls ?? null,
    comp: l.compaction_token_threshold ?? 14336, mml: l.max_model_len ?? 32768 };
}
const fmtMin = s => `${+(s / 60).toFixed(1)} min`;
const KNOWN = { locate: "--s1", edit: "--s2", submit: "--s3", swe_agent: "--s7", swe_baseline_agent: "--s7", locator: "--s4", code_analyzer_agent: "--s5" };
const SLOTS = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s7", "--s6"];
function authorColor(a) {
  if (!a || ["harness", "user", "system", "compactor"].includes(a)) return css("--other");
  if (KNOWN[a]) return css(KNOWN[a]);
  let h = 0; for (const c of a) h = (h * 31 + c.charCodeAt(0)) >>> 0; return css(SLOTS[h % SLOTS.length]);
}
const CTX_COLOR = { "system+tools": "--other", user: "--s1", summary: "--s4", assistant: "--s7", tool_calls: "--s2", tool_results: "--s3" };
const CTX_LABEL = { "system+tools": "系统提示/工具定义/未归因", user: "任务描述/用户", summary: "压缩摘要", assistant: "模型回复", tool_calls: "工具调用参数", tool_results: "工具输出" };
// Outcome labels come from the server (trace_platform/outcome.py); order = display order.
const OUTCOME = {
  PASS: ["通过", "s-ok", "--good", "harness Phase 2：补丁打上后 FAIL_TO_PASS + PASS_TO_PASS 全过"],
  TIMEOUT: ["超时", "s-warn", "--warning", "单题墙钟时间用完（Agent exceeded session timeout）"],
  BUDGET: ["预算用尽", "s-warn", "--warning", "工具调用 / 轮数预算用完（exceeded tool call / turns budget）"],
  NO_PATCH: ["无补丁", "s-err", "--critical", "正常结束但没有产出补丁"],
  ENV_ERROR: ["环境错误", "s-na", "--other", "pytest 在收集/setup 阶段就报错（缺依赖、fixture），补丁没被真正测到：不是 agent 的锅"],
  FAIL: ["测试未过", "s-err", "--critical", "有补丁，跑了测试，没过"],
  ERROR: ["报错", "s-err", "--critical", "harness / LLM / notebook 异常（看错误信息）"],
  RUNNING: ["运行中", "s-run", "--accent", "还在跑"],
  UNKNOWN: ["未知", "s-na", "--other", "没有结果行"],
};
const OUTCOME_KEYS = Object.keys(OUTCOME);
const outcomeOf = t => t.status === "running" ? "RUNNING" : (t.outcome || "UNKNOWN");
const resolvedPill = t => { const [l, c, , h] = OUTCOME[outcomeOf(t)]; return `<span class="pill ${c}" title="${esc(h)}">${l}</span>`; };
const outcomeLine = oc => OUTCOME_KEYS.filter(k => k !== "PASS" && oc?.[k]).map(k => `${OUTCOME[k][0]} ${oc[k]}`).join(" · ");

// ── charts registry (dispose on page change, resize on window resize) ──────
let charts = [];
function chart(el) { const c = echarts.init(el, null, { renderer: "canvas" }); charts.push(c); return c; }
function disposeCharts() { charts.forEach(c => c.dispose()); charts = []; }
addEventListener("resize", () => charts.forEach(c => c.resize()));
function baseAxis() {
  return { axisLine: { lineStyle: { color: css("--line") } }, axisLabel: { color: css("--muted"), fontSize: 10 },
    splitLine: { lineStyle: { color: css("--line2") } }, axisTick: { show: false } };
}
function tooltipBase() {
  return { backgroundColor: css("--panel"), borderColor: css("--line"), textStyle: { color: css("--ink"), fontSize: 12 }, extraCssText: "box-shadow:0 6px 20px rgba(0,0,0,.15);max-width:420px;white-space:normal" };
}

// ── state + routing ─────────────────────────────────────────────────────────
const S = { runs: [], route: null, run: null, tasks: null, task: null, metrics: {}, tab: {}, sort: { k: "started", d: 1 }, filter: "", fstatus: "all", sel: null };
function go(h) { if (location.hash === h) route(); else location.hash = h; }
addEventListener("hashchange", route);
function parseRoute() {
  const p = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  if (p[0] === "run" && p[1] && p[2] === "task" && p[3]) return { page: "task", run: p[1], task: p[3] };
  if (p[0] === "run" && p[1]) return { page: "run", run: p[1] };
  return { page: "home" };
}
async function route() {
  S.route = parseRoute(); disposeCharts(); S.sel = null;
  try {
    if (S.route.page === "home") await loadRuns(true);
    else if (S.route.page === "run") await loadRun(true);
    else await loadTask(true);
  } catch (e) { $("#main").innerHTML = `<div class="page"><div class="note warn">${esc(e.message)}</div></div>`; }
  renderNav();
}

// ── nav ─────────────────────────────────────────────────────────────────────
function runLive(r) { return r.source === "live" && r.status !== "done" && r.last_ingest && Date.now() / 1000 - r.last_ingest < 60; }
function runLed(r) { if (runLive(r)) return "live"; if (r.source === "live" && r.status !== "done") return "stale"; return ""; }
function renderNav() {
  const cur = S.route?.run;
  const hist = r => r.source === "import" || r.source === "shared";
  const live = S.runs.filter(r => !hist(r)), imp = S.runs.filter(hist);
  const item = r => `<a class="${r.run === cur ? "on" : ""}" onclick="go('#/run/${encodeURIComponent(r.run)}')">
    <span class="led ${runLed(r)}"></span><span class="nm">${esc(r.run)}</span><span class="count">${r.resolved}/${r.tasks}</span></a>`;
  $("#nav").innerHTML = `<a class="${S.route?.page === "home" ? "on" : ""}" onclick="go('#/')"><span class="nm">总览</span></a>
    ${live.length ? `<h6>实时 RUN</h6>${live.map(item).join("")}` : ""}
    <h6>历史 RUN</h6>${imp.map(item).join("") || '<div class="muted" style="padding:4px 10px">无</div>'}`;
}

// ── home ────────────────────────────────────────────────────────────────────
async function loadRuns(full) {
  const d = await api("/api/runs"); S.runs = d.runs;
  if (S.route.page === "home") renderHome();
  renderNav();
}
function renderHome() {
  const rows = S.runs.map(r => {
    const exp = r.expected_tasks || r.tasks || 1;
    const pOk = r.resolved / exp * 100, pDone = (r.done - r.resolved) / exp * 100, pRun = r.running / exp * 100;
    const elapsed = r.t_first ? (r.t_last - r.t_first) : null;
    return `<div class="runcard" onclick="go('#/run/${encodeURIComponent(r.run)}')">
      <div><div class="nm"><span class="led ${runLed(r)}"></span>${esc(r.run)}
        <span class="tag">${r.source === "import" ? "历史导入" : r.source === "shared" ? "共享文件" : r.source === "live" ? "实时" : "实时+对账"}</span>
        ${r.meta?.submission_fingerprint ? `<span class="tag mono">fp ${esc(r.meta.submission_fingerprint)}</span>` : ""}
        ${r.meta?.eval_config ? `<span class="tag">${r.meta.eval_config.max_tool_calls} calls / ${r.meta.eval_config.max_time_minutes} min</span>` : ""}</div>
        <div class="prog"><i style="width:${pOk}%;background:var(--good)"></i><i style="width:${pDone}%;background:var(--critical);opacity:.55"></i><i style="width:${pRun}%;background:var(--accent)"></i></div></div>
      <div style="text-align:right"><b style="font-size:16px">${r.resolved}</b><span class="muted"> / ${r.done} 完成 / ${exp}</span><br>
        <span class="muted" style="font-size:11px">${outcomeLine(r.outcomes) || "–"} · ${elapsed != null ? "跨度 " + fmtS(elapsed) : ""} · 更新 ${ago(r.updated)}</span></div></div>`;
  }).join("");
  $("#main").innerHTML = `<div class="page"><div class="ph"><div><h1 style="font-family:inherit">总览</h1>
    <p>Kaggle dev-eval 的每个 run。实时 run 通过隧道推送，历史 run 由 <span class="mono">python -m trace_platform.import_results --all</span> 导入。</p></div></div>
    <div class="card">${rows || '<div class="empty">还没有 run</div>'}</div></div>`;
}

// ── run page ────────────────────────────────────────────────────────────────
async function loadRun(full) {
  const [d, runs] = await Promise.all([api(`/api/run?run=${encodeURIComponent(S.route.run)}`), api("/api/runs")]);
  S.runs = runs.runs; S.run = d.run; S.tasks = d.tasks; S.now = d.now;
  if (full || !S.metrics[S.run.run]) S.metrics[S.run.run] = (await api(`/api/metrics?run=${encodeURIComponent(S.run.run)}`)).metrics;
  if (full) renderRun(); else updateRun();
}
function runKpis() {

  const mean = durs.length ? durs.reduce((a, b) => a + (b || 0), 0) / durs.length : null;
  const span = r.t_first ? (Math.max(r.t_last || 0, runLive(r) ? S.now : 0) - r.t_first) : null;
  const remain = Math.max(0, exp - done.length);

  const over = span != null && eta != null && span + eta > RUN_BUDGET;
  const running = ts.find(t => t.status === "running");
  const k = (v, l, extra = "") => `<div class="kpi"><b>${v}</b><span>${l}</span>${extra}</div>`;
  return `<div class="kpis">
    ${k(`${r.resolved}<span class="muted" style="font-size:13px"> / ${done.length}</span>`, `通过 / 已完成 (${exp} 题)`, `<div class="bar"><i style="width:${done.length / exp * 100}%"></i></div>`)}
    ${k(`<span style="font-size:13px">${outcomeLine(r.outcomes) || "–"}</span>`, "未通过的原因")}
    ${k(fmtS(mean), "平均每题耗时")}
    ${k(fmtK(med(ts.map(t => t.stats?.peak_ctx))), "峰值上下文 (中位)")}
    ${k(med(ts.map(t => t.stats?.compactions)) ?? "–", "压缩次数 (中位)")}
    ${k(fmtS(span), "已运行")}
    ${k(`<span style="color:${over ? "var(--err-ink)" : "inherit"}">${fmtS(eta)}</span>`, `预计剩余${over ? "（超出 12h 预算）" : ""}`, span != null ? `<div class="bar"><i style="width:${Math.min(100, (span / RUN_BUDGET) * 100)}%;background:${over ? "var(--critical)" : "var(--accent)"}"></i></div>` : "")}
    ${running ? k(`<span class="mono" style="font-size:13px">${esc(running.task)}</span>`, `当前任务 · <span data-tick="${running.started}">${fmtS(S.now - running.started)}</span> / ${fmtMin(budget().cap)}`) : ""}
  </div>`;
}

function gpuSeries(ms) {
  const ngpu = Math.max(0, ...ms.map(m => (m.gpus || []).length));
  const util = [], mem = [], power = [];
  for (let g = 0; g < ngpu; g++) {
    util.push(ms.map(m => [m.ts * 1000, m.gpus?.[g]?.util ?? null]));
    mem.push(ms.map(m => [m.ts * 1000, m.gpus?.[g]?.mem_used != null ? m.gpus[g].mem_used / 1024 : null]));
    power.push(ms.map(m => [m.ts * 1000, m.gpus?.[g]?.power ?? null]));
  }
  const kv = ms.map(m => [m.ts * 1000, m.vllm?.kv_cache != null ? m.vllm.kv_cache * 100 : null]);
  const run = ms.map(m => [m.ts * 1000, m.vllm?.running ?? null]), wait = ms.map(m => [m.ts * 1000, m.vllm?.waiting ?? null]);
  const rate = key => ms.map((m, i) => { if (!i) return [m.ts * 1000, null]; const p = ms[i - 1], a = m.vllm?.[key], b = p.vllm?.[key];
    return [m.ts * 1000, a != null && b != null && m.ts > p.ts && a >= b ? (a - b) / (m.ts - p.ts) : null]; });
  const memTotal = ms.length ? (ms[ms.length - 1].gpus || []).map(g => g.mem_total / 1024) : [];
  return { ngpu, util, mem, power, kv, run, wait, gen: rate("generation_tokens_total"), prompt: rate("prompt_tokens_total"), memTotal };
}

  $("#main").innerHTML = `<div class="page">
    <div class="crumbs"><a onclick="go('#/')">总览</a> / <a onclick="go('#/run/${encodeURIComponent(S.route.run)}')">${esc(S.route.run)}</a> / 任务</div>
    <div class="ph"><div><h1>${esc(t.task)}</h1><p>${esc(t.result?.repo || "")}${t.source ? ` · 来源 ${t.source === "final" ? "最终 trace" : "实时推送"}` : ""}</p></div><div class="grow"></div>
      <div class="seg" id="tasktabs"><button data-t="wf">瀑布图</button><button data-t="ctx">上下文窗口</button><button data-t="steps">步骤 (${t.steps.length})</button><button data-t="patch">Patch</button><button data-t="log">测试日志</button></div></div>
    <div id="taskkpis">${taskHeader()}</div><div id="taskbody"></div></div>`;
  $("#tasktabs").onclick = e => { const b = e.target.closest("button"); if (b) { S.tab.task = b.dataset.t; disposeCharts(); renderTaskBody(); } };
  renderTaskBody();
}
function updateTask() {
  $("#taskkpis").innerHTML = taskHeader();
  const tab = S.tab.task || "wf";
  if (tab === "steps") { const open = [...document.querySelectorAll(".step.open")].map(x => x.id); renderTaskBody(); open.forEach(id => document.getElementById(id)?.classList.add("open")); }
  else if (tab === "wf" || tab === "ctx") renderTaskBody(true);
  const b = $("#tasktabs button[data-t=steps]"); if (b) b.textContent = `步骤 (${S.task.steps.length})`;
}
function renderTaskBody(update) {
  const tab = S.tab.task || "wf";
  document.querySelectorAll("#tasktabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  const t = S.task, body = $("#taskbody");
  if (tab === "wf") renderWaterfall(body, update);
  else if (tab === "ctx") renderContext(body, update);
  else if (tab === "steps") body.innerHTML = renderSteps(t);
  else if (tab === "patch") body.innerHTML = `<div class="card"><div class="cb">${t.patch ? `<pre class="code diff">${t.patch.split("\n").map(l => `<span class="${/^(\+\+\+|---|@@)/.test(l) ? "h" : l[0] === "+" ? "a" : l[0] === "-" ? "d" : ""}">${esc(l)}</span>`).join("\n")}</pre>` : '<div class="empty">没有 patch</div>'}</div></div>`;
  else body.innerHTML = `<div class="card"><div class="cb">${t.test_log ? `<pre class="code">${esc(t.test_log)}</pre>` : '<div class="empty">没有测试日志</div>'}</div></div>`;
  if (tab === "steps") body.onclick = e => { const h = e.target.closest(".sh"); if (h) h.parentElement.classList.toggle("open"); }; else body.onclick = null;
}
function jumpToStep(llmIdx) {
  const st = S.task.steps.findIndex(s => s.llm === llmIdx); if (st < 0) return;
  S.tab.task = "steps"; disposeCharts(); renderTaskBody();
  const el = document.getElementById("st" + st); if (!el) return;
  el.classList.add("open", "flash"); el.scrollIntoView({ behavior: "smooth", block: "center" }); setTimeout(() => el.classList.remove("flash"), 1400);
}

// Waterfall: one row per LLM call, its tool calls on the same row; compactions shaded.
function renderWaterfall(body, update) {
  const t = S.task, running = t.status === "running";
  const now = running ? S.now - t.t0 : t.stats.duration;
  if (!t.llm.length) { body.innerHTML = `<div class="card"><div class="empty">还没有 LLM 调用</div></div>`; return; }
  const H = Math.max(240, t.llm.length * 22 + 60);
  if (!update || !$("#wf")) {
    body.innerHTML = `<div class="card"><div class="ch">阶段 <small>按子 agent 的时间区间</small></div><div class="cb"><div class="chart" id="lanes" style="height:${40 + (t.lanes.length) * 26}px"></div></div></div>
      <div class="card"><div class="ch">瀑布图 <small>每行一次 LLM 调用（宽 = 推理耗时），同一行右侧是它发起的工具调用；橙色 = 压缩；点击跳到步骤</small><span class="grow"></span>
        <span class="legend"><span><i class="dot" style="background:${css("--s2")};border-radius:50%"></i>工具</span><span><i class="dot" style="background:${css("--warning")}"></i>压缩</span><span><i class="dot" style="background:${css("--critical")}"></i>工具出错</span></span></div>
      <div class="cb"><div class="chart" id="wf" style="height:${H}px"></div></div></div>`;
  } else $("#wf").style.height = H + "px";
  const lanes = t.lanes;
  const lc = echarts.getInstanceByDom($("#lanes")) || chart($("#lanes"));
  lc.setOption({
    animation: false, grid: { left: 130, right: 20, top: 6, bottom: 22 }, tooltip: { ...tooltipBase(), formatter: p => `<b>${esc(p.data.a)}</b><br>${fmtS(p.data.value[1])} → ${fmtS(p.data.value[2])}<br>${p.data.llm} 次 LLM（${fmtS(p.data.llm_s)}）· ${p.data.tools} 次工具` },
    xAxis: { ...baseAxis(), type: "value", min: 0, max: Math.max(now, 1), axisLabel: { color: css("--muted"), fontSize: 10, formatter: v => fmtS(v) } },
    yAxis: { ...baseAxis(), type: "category", inverse: true, data: lanes.map(l => l.author), axisLabel: { color: css("--ink2"), fontSize: 11 } },
    series: [{ type: "custom", renderItem: (p, a) => { const y = a.value(0), s = a.coord([a.value(1), y]), e = a.coord([a.value(2), y]), h = a.size([0, 1])[1] * .55;
      return { type: "rect", shape: { x: s[0], y: s[1] - h / 2, width: Math.max(2, e[0] - s[0]), height: h, r: 3 }, style: { fill: authorColor(lanes[y].author), opacity: .85 } }; },
      encode: { x: [1, 2], y: 0 }, data: lanes.map((l, i) => ({ value: [i, l.start, running && i === lanes.length - 1 ? now : l.end], a: l.author, llm: l.llm, tools: l.tools, llm_s: l.llm_s })) }] }, true);

  const rows = t.llm.map(c => `#${c.i + 1} ${c.author}`);
  const data = [];
  t.llm.forEach(c => data.push({ value: [c.i, c.start, c.end], kind: "llm", c }));
  t.tools.forEach(x => data.push({ value: [x.llm, x.start, x.end ?? now], kind: "tool", x }));
  t.compactions.forEach(cp => { const row = cp.llm ?? Math.max(0, t.llm.findIndex(c => c.start >= cp.t - 0.01)); data.push({ value: [row < 0 ? t.llm.length - 1 : row, cp.t - (cp.source === "harness" ? cp.dur : 0), cp.source === "harness" ? cp.t : cp.t + (cp.dur || 0)], kind: "comp", cp }); });
  const wc = echarts.getInstanceByDom($("#wf")) || chart($("#wf"));
  wc.setOption({
    animation: false, grid: { left: 130, right: 70, top: 10, bottom: 26 },
    tooltip: { ...tooltipBase(), formatter: p => { const d = p.data;
      if (d.kind === "llm") { const c = d.c; return `<b>#${c.i + 1} ${esc(c.author)}</b> · ${fmtS(c.start)} → ${fmtS(c.end)}（${c.dur.toFixed(1)}s）<br>prompt ${c.pt?.toLocaleString() ?? "–"} · 输出 ${c.ct?.toLocaleString() ?? "–"}${c.tps ? ` · ${c.tps} tok/s` : ""}${c.compacted ? '<br><b style="color:var(--warn-ink)">本次调用前发生压缩</b>' : ""}<br><span class="mono">${esc(c.summary)}</span>`; }
      if (d.kind === "tool") { const x = d.x; return `<b>${esc(x.fn)}</b> · ${x.dur != null ? x.dur.toFixed(2) + "s" : "运行中"} · ${x.status}<br><span class="mono">${esc(x.summary)}</span>${x.result_chars ? `<br>输出 ${x.result_chars.toLocaleString()} 字符` : ""}`; }
      const cp = d.cp; return `<b>压缩</b>（${cp.source === "harness" ? "harness 记录" : "由 prompt 下降推断"}）<br>${fmtK(cp.before)} → ${fmtK(cp.after)} tokens${cp.dur ? ` · 约 ${cp.dur.toFixed(1)}s` : ""}`; } },
    xAxis: { ...baseAxis(), type: "value", min: 0, max: Math.max(now, 1), axisLabel: { color: css("--muted"), fontSize: 10, formatter: v => fmtS(v) } },
    yAxis: { ...baseAxis(), type: "category", inverse: true, data: rows, axisLabel: { color: css("--ink2"), fontSize: 10, fontFamily: "monospace" } },
    series: [{ type: "custom", renderItem: (p, a) => {
      const d = data[p.dataIndex], y = a.value(0), s = a.coord([a.value(1), y]), e = a.coord([a.value(2), y]), bh = a.size([0, 1])[1];
      if (d.kind === "comp") return { type: "rect", shape: { x: s[0], y: s[1] - bh / 2, width: Math.max(3, e[0] - s[0]), height: bh }, style: { fill: css("--warning"), opacity: .35 } };
      const h = d.kind === "llm" ? bh * .62 : bh * .36;
      const fill = d.kind === "llm" ? authorColor(d.c.author) : d.x.status === "error" ? css("--critical") : css("--s2");
      const g = { type: "group", children: [{ type: "rect", shape: { x: s[0], y: s[1] - h / 2, width: Math.max(2, e[0] - s[0]), height: h, r: 2 },
        style: { fill, opacity: d.kind === "llm" ? (d.c.dur > 30 ? 1 : .7) : (d.x.end == null ? .45 : .9), stroke: d.kind === "tool" && d.x.end == null ? fill : null, lineDash: d.kind === "tool" && d.x.end == null ? [3, 2] : null } }] };
      if (d.kind === "llm") g.children.push({ type: "text", style: { text: `${fmtK(d.c.pt)}${d.c.dur > 30 ? " · " + Math.round(d.c.dur) + "s" : ""}`, x: Math.max(e[0], s[0] + 2) + 4, y: s[1], verticalAlign: "middle", fill: css("--muted"), fontSize: 10 } });
      return g; }, encode: { x: [1, 2], y: 0 }, data: data.map(d => ({ ...d, value: d.value })) }] }, true);
  wc.off("click"); wc.on("click", p => { const d = p.data; if (d.kind === "llm") jumpToStep(d.c.i); else if (d.kind === "tool") jumpToStep(d.x.llm); });
}

// Context window: stacked composition per call, threshold lines, selected-call bar, compaction cards.
function renderContext(body, update) {
  const t = S.task, L = t.limits, cats = t.ctx_cats;
  const calls = t.llm.filter(c => c.context);
  if (!calls.length) { body.innerHTML = `<div class="card"><div class="empty">还没有带 token 数的 LLM 调用</div></div>`; return; }
  if (S.sel == null || S.sel >= calls.length) S.sel = calls.length - 1;
  if (!update || !$("#ctx")) {
    body.innerHTML = `<div class="grid g3">
      <div class="card"><div class="ch">上下文增长 <small>每次 LLM 调用的 prompt tokens 及构成（构成按字符估算，总量为真实值）；点选一次调用查看构成</small></div>
        <div class="cb"><div class="legend" style="margin-bottom:6px">${cats.map(k => `<span><i class="dot" style="background:${css(CTX_COLOR[k])}"></i>${CTX_LABEL[k]}</span>`).join("")}</div><div class="chart" id="ctx" style="height:330px"></div></div></div>
      <div class="card"><div class="ch">所选调用的窗口 <small id="ctxsel"></small></div><div class="cb" id="ctxdetail"></div></div></div>
      <div class="card"><div class="ch">压缩 <small>${t.compactions.length} 次 · 阈值 ${L.compaction.toLocaleString()} tokens</small></div><div class="cb" id="comps"></div></div>`;
  }
  const xs = calls.map(c => c.end);
  const c = echarts.getInstanceByDom($("#ctx")) || chart($("#ctx"));
  c.setOption({
    animation: false, grid: { left: 52, right: 16, top: 16, bottom: 28 },
    tooltip: { ...tooltipBase(), trigger: "axis", formatter: ps => { const cl = calls[ps[0].dataIndex];
      return `<b>#${cl.i + 1} ${esc(cl.author)}</b> · ${fmtS(cl.end)}<br>prompt <b>${cl.pt.toLocaleString()}</b>${cl.compacted ? ' · <span style="color:var(--warn-ink)">压缩后</span>' : ""}<br>` +
        cats.slice().reverse().filter(k => cl.context[k] > 0).map(k => `<i class="dot" style="background:${css(CTX_COLOR[k])}"></i> ${CTX_LABEL[k]}: ${fmtK(cl.context[k])}`).join("<br>"); } },
    xAxis: { ...baseAxis(), type: "value", min: 0, axisLabel: { color: css("--muted"), fontSize: 10, formatter: v => fmtS(v) } },
    yAxis: { ...baseAxis(), type: "value", max: v => Math.max(L.max_model_len * 1.04, v.max), axisLabel: { color: css("--muted"), fontSize: 10, formatter: v => fmtK(v) } },
    // Stacked by hand: with two value axes echarts would stack the x values. Each series is
    // the cumulative sum up to its category; drawn top-first and opaque so lower ones cover.
    series: cats.map((_, i) => cats[cats.length - 1 - i]).map((k, i) => ({ name: k, type: "line", showSymbol: false, lineStyle: { width: 0 }, z: 2 + i,
      areaStyle: { color: css(CTX_COLOR[k]), opacity: 1 },
      data: calls.map((cl, j) => [xs[j], cats.slice(0, cats.length - i).reduce((a, kk) => a + (cl.context[kk] || 0), 0)]),
      ...(i === 0 ? { markLine: { silent: true, symbol: "none", data: [
        { yAxis: L.compaction, lineStyle: { color: css("--warning"), type: "dashed" }, label: { formatter: `压缩阈值 ${fmtK(L.compaction)}`, position: "insideEndTop", color: css("--warn-ink"), fontSize: 10 } },
        { yAxis: L.max_model_len, lineStyle: { color: css("--critical"), type: "dashed" }, label: { formatter: `max_model_len ${fmtK(L.max_model_len)}`, position: "insideEndTop", color: css("--err-ink"), fontSize: 10 } },
        ...t.compactions.map(cp => ({ xAxis: cp.t, lineStyle: { color: css("--warning"), width: 2 }, label: { show: false } })),
        ...t.lanes.slice(1).map(l => ({ xAxis: l.start, lineStyle: { color: authorColor(l.author), type: "dotted" }, label: { formatter: l.author, color: css("--muted"), fontSize: 10, position: "insideStartTop" } }))] } } : {}) }))
    .concat([{ name: "_sel", type: "scatter", symbolSize: 9, data: [[xs[S.sel], calls[S.sel].pt]], itemStyle: { color: css("--ink") }, silent: true, tooltip: { show: false } }]) }, true);
  c.getZr().off("click");
  c.getZr().on("click", e => { const p = c.convertFromPixel({ gridIndex: 0 }, [e.offsetX, e.offsetY]); if (!p) return;
    let best = 0; xs.forEach((x, j) => { if (Math.abs(x - p[0]) < Math.abs(xs[best] - p[0])) best = j; }); S.sel = best; renderContext(body, true); });
  const sel = calls[S.sel], tot = L.max_model_len;
  $("#ctxsel").textContent = `#${sel.i + 1} ${sel.author} · ${fmtS(sel.end)}`;
  $("#ctxdetail").innerHTML = `
    <div style="font-size:22px;font-weight:600;font-variant-numeric:tabular-nums">${sel.pt.toLocaleString()} <span class="muted" style="font-size:12px;font-weight:400">/ ${tot.toLocaleString()} tokens（${(sel.pt / tot * 100).toFixed(0)}%）</span></div>
    <div class="ctxbar" style="margin:8px 0 4px">${cats.map(k => `<i style="width:${(sel.context[k] || 0) / tot * 100}%;background:${css(CTX_COLOR[k])}" title="${CTX_LABEL[k]} ${fmtK(sel.context[k])}"></i>`).join("")}
      <span class="mark" style="left:${L.compaction / tot * 100}%;background:var(--warning)" title="压缩阈值"></span></div>
    <div class="muted" style="font-size:11px;margin-bottom:10px">橙线 = 压缩阈值 ${fmtK(L.compaction)}；离阈值还剩 ${fmtK(Math.max(0, L.compaction - sel.pt))}</div>
    <table>${cats.map(k => `<tr><td><i class="dot" style="background:${css(CTX_COLOR[k])}"></i> ${CTX_LABEL[k]}</td><td class="num">${fmtK(sel.context[k])}</td><td class="num muted">${((sel.context[k] || 0) / sel.pt * 100).toFixed(0)}%</td></tr>`).join("")}</table>
    <div class="lbl">这次调用</div><div style="font-size:12px">输出 ${sel.ct?.toLocaleString() ?? "–"} tokens · 耗时 ${sel.dur.toFixed(1)}s${sel.tps ? ` · ${sel.tps} tok/s` : ""}<br><span class="mono">${esc(sel.summary)}</span></div>
    <div style="margin-top:8px"><a class="link" style="color:var(--accent);cursor:pointer" onclick="jumpToStep(${sel.i})">查看这一步 →</a></div>`;
  $("#comps").innerHTML = t.compactions.length ? t.compactions.map(cp => `<div class="comp">
    <span class="pill s-warn">${fmtS(cp.t)}</span> <span class="chip-a" style="background:${authorColor(cp.author)}">${esc(cp.author)}</span>
    <b style="margin-left:6px">${fmtK(cp.before)} → ${fmtK(cp.after)}</b> tokens ${cp.before && cp.after ? `<span class="muted">（-${Math.round((1 - cp.after / cp.before) * 100)}%）</span>` : ""}
    ${cp.dur ? `<span class="muted"> · 这次调用耗时 ${cp.dur.toFixed(1)}s</span>` : ""} <span class="tag">${cp.source === "harness" ? "harness 记录" : "由 prompt 下降推断"}</span>
    ${cp.summary ? `<div class="lbl">摘要</div><pre class="code" style="max-height:200px">${esc(cp.summary)}</pre>` : ""}</div>`).join("") : '<div class="muted">没有压缩</div>';
}

function renderSteps(t) {
  return t.steps.map((s, k) => {
    const c = authorColor(s.author);
    const parts = [];
    if (s.thought) parts.push(`<div class="lbl">思考</div><pre class="code th">${esc(s.thought)}</pre>`);
    if (s.msg) parts.push(`<div class="lbl">${s.kind === "llm" ? "回复" : esc(s.kind)}</div><pre class="code">${esc(s.msg)}</pre>`);
    for (const ti of s.calls || []) { const x = t.tools[ti];
      parts.push(`<div class="lbl">调用 · ${esc(x.fn)} · ${x.dur != null ? x.dur.toFixed(2) + "s" : "运行中"}</div><pre class="code">${esc(x.args)}</pre>`);
      if (x.result != null) parts.push(`<div class="lbl">输出 · ${(x.result_chars || 0).toLocaleString()} 字符 ${x.status === "error" ? '<span class="pill s-err">error</span>' : ""}</div><pre class="code">${esc(x.result)}</pre>`); }
    const sum = (s.calls || []).length ? s.calls.map(ti => `<span class="fn">${esc(t.tools[ti].fn)}</span> ${esc(t.tools[ti].summary)}`).join(" ; ") : esc((s.msg || s.thought || "").slice(0, 200));
    return `<div class="step" id="st${k}" style="--c:${c}"><div class="sh"><span class="n">${s.kind === "llm" ? "#" + (s.llm + 1) : "·"}</span>
      <span class="chip-a" style="background:${c}">${esc(s.author || "?")}</span>${s.kind !== "llm" ? `<span class="tag">${esc(s.kind)}</span>` : ""}
      ${s.compacted ? '<span class="pill s-warn">压缩后</span>' : ""}<span class="sum">${sum}</span>
      <span class="meta">${fmtS(s.t)}${s.dt ? ` · +${s.dt.toFixed(1)}s` : ""}${s.pt ? ` · in ${fmtK(s.pt)} / out ${fmtK(s.ct)}` : ""}</span></div>
      <div class="sb">${parts.join("") || '<div class="muted">（空）</div>'}</div></div>`;
  }).join("") || '<div class="card"><div class="empty">还没有步骤</div></div>';
}

// ── live updates ────────────────────────────────────────────────────────────
let pending = null, pendingMetrics = false;
function schedule(kind) {
  if (kind === "metrics") pendingMetrics = true;
  if (pending) return;
  pending = setTimeout(async () => {
    pending = null; const m = pendingMetrics; pendingMetrics = false;
    try {
      const r = S.route;
      if (r.page === "home") await loadRuns(false);
      else if (r.page === "run") {
        if (m && S.run) { const ms = S.metrics[S.run.run] || []; const add = (await api(`/api/metrics?run=${encodeURIComponent(S.run.run)}&since=${ms.length ? ms[ms.length - 1].ts : 0}`)).metrics; S.metrics[S.run.run] = ms.concat(add); }
        await loadRun(false);
      } else await loadTask(false);
      renderNav();
    } catch (e) { console.warn(e); }
  }, 800);
}
function connect() {
  let es;
  try { es = new EventSource("/api/stream"); } catch (e) { return; }
  es.onopen = () => { $("#sse-led").className = "led live"; $("#sse-txt").textContent = "实时连接"; };
  es.onerror = () => { $("#sse-led").className = "led stale"; $("#sse-txt").textContent = "重连中…（每 3s 轮询）"; };
  es.onmessage = ev => { const m = JSON.parse(ev.data); const r = S.route; if (!r) return;
    if (r.page === "home" || m.type === "run") return schedule(m.type);
    if (m.run !== r.run) { if (m.type === "task") schedule("nav"); return; }
    if (r.page === "run") schedule(m.type);
    else if (m.type !== "metrics" && (m.task === r.task)) schedule(m.type); };
}
setInterval(() => { if ($("#sse-led").className.includes("stale")) schedule("poll"); }, 3000);
setInterval(() => { // tick running timers
  document.querySelectorAll("[data-tick]").forEach(el => { el.textContent = fmtS(Date.now() / 1000 - parseFloat(el.dataset.tick)); });
}, 1000);
$("#theme").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("gt-theme", r.dataset.theme); } catch (e) {} route(); };
try { const th = localStorage.getItem("gt-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
connect(); route();
</script>
</body>
</html>
